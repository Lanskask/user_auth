services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_auth"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_ADDR: ":8080"
      AUTH_DATABASE_URL: postgres://postgres:postgres@db:5432/user_auth?sslmode=disable
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
